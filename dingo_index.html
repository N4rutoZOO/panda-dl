<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#11151c">
<title>Dingo-dl</title>
<style>
:root{--bg:#12151d;--top:#34394c;--shell:#3f4554;--inner:#171b22;--panel:#262c37;--deep:#11151c;--line:#48505e;--text:#d8dde6;--muted:#858e9e;--blue:#6da7ff;--orange:#ff9634;--pink:#d85de5;--green:#7ce2a7;--danger:#ff8798}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,var(--top),var(--bg) 45%,#090c12 100%);color:var(--text);font:14px/1.35 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}.page{width:min(1170px,calc(100% - 24px));margin:0 auto;padding:18px 0 60px}.topbar{display:flex;align-items:center;justify-content:space-between;padding:4px 10px 12px}.brand{font-size:22px;font-weight:900;letter-spacing:.08em}.brand b{color:var(--blue)}.health{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px}.led{width:9px;height:9px;border-radius:50%;background:#666;box-shadow:0 0 10px currentColor}.led.ok{background:var(--green);color:var(--green)}.led.warn{background:var(--orange);color:var(--orange)}.led.bad{background:var(--danger);color:var(--danger)}
.device{border-radius:40px;padding:16px;background:linear-gradient(180deg,#525968,#343a47 35%,#282e39);border:1px solid #697181;box-shadow:0 24px 60px rgba(0,0,0,.5),inset 0 2px 2px rgba(255,255,255,.18),inset 0 -3px 7px rgba(0,0,0,.55)}.inner{border-radius:27px;padding:16px;background:linear-gradient(180deg,#1d222b,var(--inner));box-shadow:inset 0 1px 1px rgba(255,255,255,.06),inset 0 -3px 7px rgba(0,0,0,.45)}
.display{position:relative;height:300px;border-radius:18px;overflow:hidden;background:#0a0f16;border:1px solid #343c49;box-shadow:inset 0 0 30px rgba(0,0,0,.7)}.grid{position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.055) 0 1px,transparent 1px 12.5%);opacity:.55}.wave{position:absolute;border-radius:50%;filter:blur(1px);mix-blend-mode:screen;transition:transform .35s,opacity .35s}.wave.purple{width:520px;height:240px;left:-130px;bottom:-95px;background:radial-gradient(ellipse at center,rgba(114,76,255,.8),rgba(216,93,229,.42) 48%,transparent 72%);box-shadow:0 0 45px rgba(137,73,255,.45)}.wave.orange{width:620px;height:260px;right:-120px;bottom:-115px;background:radial-gradient(ellipse at center,rgba(255,150,52,.82),rgba(255,93,145,.38) 50%,transparent 73%);box-shadow:0 0 45px rgba(255,130,60,.35)}.display[data-state="loading"] .wave{animation:pulse 1.2s ease-in-out infinite alternate}.display[data-state="downloading"] .wave{animation:pulse .6s ease-in-out infinite alternate}@keyframes pulse{to{transform:scale(1.08) translateY(-8px);opacity:.88}}
.hero{position:absolute;inset:32px 28px auto;z-index:2;display:flex;justify-content:space-between;gap:20px}.hero-title{font-size:44px;font-weight:900;letter-spacing:.08em;color:#444b58;text-transform:uppercase}.hero-state{font-size:12px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;padding-top:10px}.preview{position:absolute;left:24px;bottom:78px;z-index:3;display:none;align-items:center;gap:12px;max-width:70%}.preview.show{display:flex}.preview img{width:118px;height:66px;object-fit:cover;border-radius:10px;border:1px solid #4b5566;background:#111}.ptext{min-width:0}.ptitle{font-weight:800;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pmeta{color:var(--muted);font-size:12px;margin-top:4px}.urlbar{position:absolute;left:18px;right:18px;bottom:16px;z-index:4;display:grid;grid-template-columns:1fr auto;gap:10px}.urlwrap{position:relative}.urlbar input{width:100%;height:48px;background:rgba(13,18,26,.88);color:white;border:1px solid #475164;border-radius:12px;padding:0 46px 0 14px;outline:none}.urlbar input:focus{border-color:#7567ff;box-shadow:0 0 0 3px rgba(117,103,255,.13)}.clear{position:absolute;right:8px;top:8px;width:32px;height:32px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:18px}.btn{border:1px solid #475164;border-radius:10px;background:#1a202b;color:var(--text);font-weight:800;padding:0 16px;min-height:42px;cursor:pointer;transition:.18s}.btn:hover{transform:translateY(-1px);border-color:#6d788f}.btn.primary{border:0;background:linear-gradient(120deg,#4a72ff,#8c4fff,#dc54cf);color:white;box-shadow:0 9px 24px rgba(105,75,255,.24)}.btn:disabled{opacity:.5;cursor:default;transform:none}
.modules{display:grid;grid-template-columns:1.15fr .9fr .9fr 1.05fr;gap:8px;margin-top:10px}.module{min-height:150px;border-radius:22px;background:linear-gradient(180deg,#303643,#242a34);border:1px solid #151920;box-shadow:inset 0 1px rgba(255,255,255,.06),inset 0 -3px 6px rgba(0,0,0,.42);padding:14px}.module h3{margin:0 0 12px;font-size:13px;letter-spacing:.08em}.seg{display:flex;gap:7px;flex-wrap:wrap}.seg button{flex:1 1 30%;min-width:70px;height:39px;border-radius:9px;border:1px solid #465064;background:#171c25;color:var(--muted);font-weight:800;cursor:pointer}.seg button.active{color:white;border-color:#7463ff;background:linear-gradient(180deg,#343063,#222445);box-shadow:inset 0 0 18px rgba(110,87,255,.18)}select{width:100%;height:42px;background:#171c25;color:white;border:1px solid #465064;border-radius:9px;padding:0 10px;outline:none}.presets{display:grid;grid-template-columns:1fr 1fr;gap:7px}.presets button{height:39px;border-radius:9px;border:1px solid #465064;background:#171c25;color:var(--muted);font-weight:800;cursor:pointer}.presets button:hover{color:white;border-color:#8c58ff}
.meta-row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 2px 0}.chip{padding:7px 9px;border-radius:8px;background:#171c25;border:1px solid #394355;color:var(--muted);font-size:12px}.panel{display:none;margin-top:12px;border-radius:18px;overflow:hidden;background:#10151d;border:1px solid #303a4b}.panel.show{display:block}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 12px;border-bottom:1px solid #273040}.panel-title{font-weight:900;letter-spacing:.06em}.panel-actions{display:flex;gap:6px;flex-wrap:wrap}.panel-actions .btn{min-height:34px;padding:0 10px;font-size:12px}.list{max-height:420px;overflow:auto}.row{display:grid;grid-template-columns:34px 48px 78px minmax(180px,1fr) 92px 150px;gap:8px;align-items:center;padding:9px 11px;border-bottom:1px solid #202838}.row:last-child{border-bottom:0}.row img{width:70px;height:40px;object-fit:cover;border-radius:6px;background:#090c13}.row .title{font-weight:700;min-width:0}.row .muted{color:var(--muted);font-size:12px}.row input[type="text"]{width:100%;background:#111720;border:1px solid #394458;color:white;border-radius:7px;padding:8px}.summary{padding:9px 12px;color:var(--muted);font-size:12px;border-top:1px solid #222a38}.job{margin-top:12px;border-radius:16px;background:#10151d;border:1px solid #303a4b;padding:12px;display:none}.job.show{display:block}.progress{height:8px;border-radius:999px;background:#222a38;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6658ff,#d85de5,#ff9634);transition:width .25s}.jobline{display:flex;justify-content:space-between;gap:10px;margin-top:8px;color:var(--muted);font-size:12px}.cta{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.download-btn{min-width:220px;height:50px}.error{color:var(--danger)}.success{color:var(--green)}
@media(max-width:820px){.modules{grid-template-columns:1fr 1fr}.hero-title{font-size:32px}.preview{max-width:92%}.row{grid-template-columns:32px 42px 70px minmax(160px,1fr) 75px}.row .owner{display:none}.device{border-radius:28px;padding:10px}.inner{padding:10px}.display{height:280px}.urlbar{grid-template-columns:1fr}.urlbar .primary{height:46px}}
@media(max-width:560px){.page{width:min(100% - 12px,560px);padding-top:8px}.topbar{padding:4px 4px 10px}.brand{font-size:18px}.device{border-radius:24px}.display{height:315px}.hero{inset:20px 18px auto}.hero-title{font-size:26px}.preview{left:18px;bottom:120px}.preview img{width:84px;height:48px}.urlbar{left:10px;right:10px;bottom:10px}.modules{grid-template-columns:1fr}.module{min-height:auto}.cta{position:sticky;bottom:8px;z-index:10;background:linear-gradient(180deg,transparent,#11151d 25%);padding-top:16px}.download-btn{width:100%}.row{grid-template-columns:28px 34px 1fr 66px;padding:8px}.row img,.row .owner{display:none}.row .rename{grid-column:3/5}.hero-state{font-size:10px}}
</style>
</head>
<body>
<div class="page">
  <div class="topbar"><div class="brand">Dingo-<b>dl</b></div><div class="health"><span id="healthLed" class="led"></span><span id="healthText">API…</span></div></div>
  <div class="device"><div class="inner">
    <section id="display" class="display" data-state="idle">
      <div class="grid"></div><div class="wave purple"></div><div class="wave orange"></div>
      <div class="hero"><div class="hero-title">Dingo-dl</div><div id="heroState" class="hero-state">READY</div></div>
      <div id="preview" class="preview"><img id="thumb" alt=""><div class="ptext"><div id="title" class="ptitle"></div><div id="meta" class="pmeta"></div></div></div>
      <div class="urlbar"><div class="urlwrap"><input id="url" autocomplete="off" placeholder="Coller un lien public…"><button id="clear" class="clear" type="button">×</button></div><button id="analyze" class="btn primary" type="button">ANALYSER →</button></div>
    </section>

    <div class="modules">
      <div class="module"><h3>MODE</h3><div id="mode" class="seg"><button class="active" data-mode="video">VIDÉO</button><button data-mode="audio">AUDIO</button><button data-mode="photo">PHOTO</button></div></div>
      <div class="module"><h3>QUALITY</h3><select id="quality"><option value="">BEST</option><option value="2160">2160P</option><option value="1440">1440P</option><option value="1080">1080P</option><option value="720">720P</option><option value="480">480P</option><option value="360">360P</option></select></div>
      <div class="module"><h3>FORMAT</h3><select id="format"><option value="mp4">MP4</option><option value="mkv">MKV</option><option value="webm">WEBM</option></select></div>
      <div class="module"><h3>PRESETS</h3><div class="presets"><button data-preset="best">BEST VIDEO</button><button data-preset="1080">1080P MP4</button><button data-preset="mp3">MP3 320</button><button data-preset="photo">PHOTOS</button></div></div>
    </div>

    <div id="chips" class="meta-row"></div>

    <section id="playlistPanel" class="panel"><div class="panel-head"><div class="panel-title">PLAYLIST</div><div class="panel-actions"><button class="btn" data-sel="all">Tout</button><button class="btn" data-sel="none">Aucun</button><button class="btn" data-sel="invert">Inverser</button></div></div><div id="playlistList" class="list"></div><div id="playlistSummary" class="summary"></div></section>
    <section id="trackPanel" class="panel"><div class="panel-head"><div class="panel-title">TRACKS AUDIO</div><div class="panel-actions"><button class="btn" data-tsel="all">Tout</button><button class="btn" data-tsel="none">Aucun</button><button class="btn" data-tsel="invert">Inverser</button></div></div><div id="trackList" class="list"></div><div id="trackSummary" class="summary"></div></section>

    <div id="job" class="job"><div class="progress"><i id="bar"></i></div><div class="jobline"><span id="jobText">Prêt</span><span id="jobPct"></span></div></div>
    <div class="cta"><button id="download" class="btn primary download-btn" type="button">TÉLÉCHARGER ↓</button></div>
  </div></div>
</div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const ui={url:$('#url'),analyze:$('#analyze'),display:$('#display'),hero:$('#heroState'),preview:$('#preview'),thumb:$('#thumb'),title:$('#title'),meta:$('#meta'),chips:$('#chips'),playlist:$('#playlistPanel'),playlistList:$('#playlistList'),playlistSummary:$('#playlistSummary'),tracks:$('#trackPanel'),trackList:$('#trackList'),trackSummary:$('#trackSummary'),quality:$('#quality'),format:$('#format'),download:$('#download'),job:$('#job'),bar:$('#bar'),jobText:$('#jobText')};
let state={mode:'video',data:null,details:null,controller:null};
const cache=new Map();
function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function t(sec){if(sec==null)return'--:--';sec=Math.floor(sec);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`}
function setState(name,text){ui.display.dataset.state=name;ui.hero.textContent=(text||name).toUpperCase()}
async function api(path,payload=null,opts={}){const cfg={method:payload===null?'GET':'POST',headers:{Accept:'application/json'},cache:'no-store',...opts};if(payload!==null){cfg.headers={...cfg.headers,'Content-Type':'application/json'};cfg.body=JSON.stringify(payload)}let r;try{r=await fetch(path,cfg)}catch(e){throw new Error('Serveur Dingo-dl inaccessible')}const raw=await r.text(),ct=(r.headers.get('content-type')||'').toLowerCase();if(!ct.includes('application/json')){console.error('API HTML/non JSON',path,r.status,raw.slice(0,500));throw new Error(raw.trimStart().startsWith('<')?'Le serveur a renvoyé une page HTML à la place du JSON':'Réponse API invalide')};let data;try{data=raw?JSON.parse(raw):{}}catch{throw new Error('JSON API invalide')}if(!r.ok)throw new Error(String(data.detail||data.error||'Erreur serveur').replace(/\x1b\[[0-9;]*m/g,''));return data}
function localDetect(url){try{const u=new URL(url);const h=u.hostname.replace('www.','');if(h.includes('youtu')){let id=u.searchParams.get('v');if(h==='youtu.be')id=u.pathname.split('/')[1];if(!id){const m=u.pathname.match(/\/(?:shorts|embed|live)\/([^/?]+)/);if(m)id=m[1]}if(id){ui.thumb.src=`https://i.ytimg.com/vi/${id}/hqdefault.jpg`;ui.preview.classList.add('show')}return u.searchParams.has('list')?'YouTube • PLAYLIST':'YouTube • VIDEO'}if(h.includes('instagram'))return'Instagram';if(h.includes('tiktok'))return'TikTok';if(h.includes('pinterest')||h==='pin.it')return'Pinterest';if(h.includes('soundcloud'))return'SoundCloud';return h}catch{return''}}
function chips(items){ui.chips.innerHTML=items.filter(Boolean).map(x=>`<span class="chip">${esc(x)}</span>`).join('')}
function renderPreview(d){state.data=d;ui.preview.classList.add('show');if(d.thumbnail)ui.thumb.src=d.thumbnail;ui.title.textContent=d.title||'Media';ui.meta.textContent=[d.uploader,d.extractor].filter(Boolean).join(' • ');chips([d.extractor,d.duration?t(d.duration):null,d.is_playlist?`${d.entries?.length||0} vidéos`:null,d.tracks?.length?`${d.tracks.length} tracks`:null]);if(d.is_playlist&&d.entries?.length)renderPlaylist(d.entries);else ui.playlist.classList.remove('show')}
function renderPlaylist(entries){ui.playlist.classList.add('show');ui.playlistList.innerHTML=entries.map((e,i)=>`<div class="row"><input class="pcheck" type="checkbox" data-index="${e.index??i}" checked><div class="muted">${String((e.number??i+1)).padStart(2,'0')}</div><img loading="lazy" src="${esc(e.thumbnail||'')}"><div class="title">${esc(e.title||'')}</div><div class="muted">${t(e.duration)}</div><div class="owner muted">${esc(e.uploader||'')}</div></div>`).join('');$$('.pcheck').forEach(x=>x.onchange=playlistCount);playlistCount()}
function playlistCount(){const a=$$('.pcheck'),c=$$('.pcheck:checked');ui.playlistSummary.textContent=`${c.length} / ${a.length} sélectionnées`}
function renderTracks(tracks){ui.tracks.classList.toggle('show',!!tracks?.length);ui.trackList.innerHTML=(tracks||[]).map((e,i)=>`<div class="row"><input class="tcheck" type="checkbox" data-index="${i}" checked><div class="muted">${String(e.number??i+1).padStart(2,'0')}</div><div class="muted">${t(e.start_time)}</div><div class="title">${esc(e.title||'Track')}</div><div class="muted">${t(e.end_time)}</div><input class="rename" type="text" data-index="${i}" value="${esc(`${String(e.number??i+1).padStart(2,'0')} - ${e.title||'Track'}`)}"></div>`).join('');$$('.tcheck').forEach(x=>x.onchange=trackCount);trackCount()}
function trackCount(){const a=$$('.tcheck'),c=$$('.tcheck:checked');ui.trackSummary.textContent=`${c.length} / ${a.length} tracks sélectionnées`}
async function analyze(){const url=ui.url.value.trim();if(!url)return;state.controller?.abort();state.controller=new AbortController();localDetect(url);setState('loading','ANALYSING');ui.analyze.disabled=true;const key='fast:'+url;try{let d=cache.get(key);if(!d){d=await api('/api/analyze-fast',{url},{signal:state.controller.signal});cache.set(key,d)}renderPreview(d);setState('idle',d.is_playlist?'PLAYLIST READY':'PREVIEW READY');if(!d.is_playlist){api('/api/details',{url},{signal:state.controller.signal}).then(details=>{state.details=details;if(details.duration&&state.data)state.data.duration=details.duration;renderTracks(details.tracks||[]);const hs=[...new Set((details.formats||[]).map(f=>f.height).filter(Boolean))].sort((a,b)=>b-a);ui.quality.innerHTML='<option value="">BEST</option>'+hs.map(h=>`<option value="${h}">${h}P</option>`).join('');chips([state.data?.extractor,details.duration?t(details.duration):null,hs.length?`${hs.length} résolutions`:null,details.tracks?.length?`${details.tracks.length} tracks`:null]);setState('idle',details.tracks?.length?'TRACKS FOUND':'READY')}).catch(err=>{console.warn(err);setState('idle','PREVIEW READY');ui.job.classList.add('show');ui.jobText.innerHTML=`<span class="error">${esc(err.message)}</span>`})}}catch(err){if(err.name!=='AbortError'){ui.job.classList.add('show');ui.jobText.innerHTML=`<span class="error">${esc(err.message)}</span>`;setState('idle','ERROR')}}finally{ui.analyze.disabled=false}}
function setMode(mode){state.mode=mode;$$('#mode button').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));if(mode==='video'){ui.quality.disabled=false;ui.format.innerHTML='<option value="mp4">MP4</option><option value="mkv">MKV</option><option value="webm">WEBM</option>'}else if(mode==='audio'){ui.quality.innerHTML='<option value="320">320 KBPS</option><option value="256">256 KBPS</option><option value="192">192 KBPS</option><option value="128">128 KBPS</option>';ui.format.innerHTML='<option value="mp3">MP3</option><option value="m4a">M4A</option><option value="flac">FLAC</option><option value="wav">WAV</option>';ui.quality.disabled=false}else{ui.quality.innerHTML='<option value="">ORIGINAL</option>';ui.format.innerHTML='<option value="zip">ORIGINAL / ZIP</option>';ui.quality.disabled=true}}
async function download(){const url=ui.url.value.trim();if(!url)return;let kind=state.mode;if(state.data?.is_playlist&&kind==='video')kind='playlist';if(ui.tracks.classList.contains('show')&&$$('.tcheck:checked').length&&kind==='audio')kind='tracks';const body={url,kind,output_format:ui.format.value,height:state.mode==='video'&&ui.quality.value?Number(ui.quality.value):null,audio_kbps:state.mode==='audio'&&ui.quality.value?Number(ui.quality.value):320,selected_indices:$$('.pcheck:checked').map(x=>Number(x.dataset.index)),tracks:[]};if(kind==='tracks'){body.tracks=$$('.tcheck:checked').map(x=>{const i=Number(x.dataset.index),tr=state.details.tracks[i],name=$(`.rename[data-index="${i}"]`)?.value||tr.title;return{index:i,title:tr.title,start_time:tr.start_time,end_time:tr.end_time,filename:name}})}ui.download.disabled=true;ui.job.classList.add('show');ui.bar.style.width='35%';ui.jobText.textContent='Téléchargement / traitement…';setState('downloading','DOWNLOADING');try{const r=await fetch('/api/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok){const raw=await r.text();let msg=raw;try{msg=JSON.parse(raw).detail||raw}catch{}throw new Error(msg)}ui.bar.style.width='100%';const blob=await r.blob();let name='Dingo-dl-download';const cd=r.headers.get('content-disposition')||'',m=cd.match(/filename\*?=(?:UTF-8''|\")?([^\";]+)/i);if(m)name=decodeURIComponent(m[1].replace(/\"/g,''));const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);ui.jobText.innerHTML='<span class="success">Terminé</span>';setState('idle','READY')}catch(err){ui.jobText.innerHTML=`<span class="error">${esc(err.message)}</span>`;setState('idle','ERROR')}finally{ui.download.disabled=false}}
$('#clear').onclick=()=>{state.controller?.abort();ui.url.value='';ui.preview.classList.remove('show');ui.playlist.classList.remove('show');ui.tracks.classList.remove('show');ui.chips.innerHTML='';ui.job.classList.remove('show');setState('idle','READY')};ui.analyze.onclick=analyze;ui.download.onclick=download;ui.url.addEventListener('keydown',e=>{if(e.key==='Enter')analyze();if(e.key==='Escape')$('#clear').click()});ui.url.addEventListener('paste',()=>setTimeout(()=>{if(/^https?:\/\//.test(ui.url.value.trim()))analyze()},250));$$('#mode button').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));$$('[data-preset]').forEach(b=>b.onclick=()=>{const p=b.dataset.preset;if(p==='best'){setMode('video');ui.quality.value='';ui.format.value='mp4'}if(p==='1080'){setMode('video');ui.quality.value='1080';ui.format.value='mp4'}if(p==='mp3'){setMode('audio');ui.quality.value='320';ui.format.value='mp3'}if(p==='photo')setMode('photo')});$$('[data-sel]').forEach(b=>b.onclick=()=>{$$('.pcheck').forEach(x=>x.checked=b.dataset.sel==='all'?true:b.dataset.sel==='none'?false:!x.checked);playlistCount()});$$('[data-tsel]').forEach(b=>b.onclick=()=>{$$('.tcheck').forEach(x=>x.checked=b.dataset.tsel==='all'?true:b.dataset.tsel==='none'?false:!x.checked);trackCount()});
api('/api/ping').then(()=>{$('#healthLed').className='led ok';$('#healthText').textContent='API READY'}).catch(()=>{$('#healthLed').className='led bad';$('#healthText').textContent='API OFFLINE'});setMode('video');
</script>
</body>
</html>
