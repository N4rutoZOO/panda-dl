<script>
const $=s=>document.querySelector(s);
let mode='video',quality='best',info=null,job=null,poll=null,user=null,googleCfg=null;
const vq=['best','2160','1440','1080','720','480','360'],aq=['320','256','192','128'];
function err(m){$('#error').textContent=m||'Erreur';$('#error').classList.add('show')}
function clearErr(){$('#error').classList.remove('show')}
function fmt(s){if(s==null)return'';s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),x=s%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`:`${m}:${String(x).padStart(2,'0')}`}
function bytes(n){if(!n)return'';const u=['B','KB','MB','GB'];let i=0;while(n>1024&&i<3){n/=1024;i++}return `${n.toFixed(i>1?1:0)} ${u[i]}`}
function sync(){const f=mode==='video'?'MP4':mode==='audio'?'MP3':'IMAGES';$('#formatKnob').textContent=f;$('#output').textContent=mode==='video'?'MP4 · EMBED METADATA':mode==='audio'?'MP3 · EMBED METADATA':'ORIGINAL / ZIP';document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));renderQuality();$('#trackEditor').classList.toggle('show',mode==='audio'&&info&&info.chapters&&info.chapters.length>0);$('#playlistEditor').classList.toggle('show',!!(info&&info.is_playlist&&info.playlist_entries&&info.playlist_entries.length))}

document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;quality=mode==='video'?'best':mode==='audio'?'320':'best';sync()});
$('#pBest').onclick=()=>{mode='video';quality='best';sync()};$('#p1080').onclick=()=>{mode='video';quality='1080';sync()};$('#p320').onclick=()=>{mode='audio';quality='320';sync()};$('#pPhoto').onclick=()=>{mode='image';quality='best';sync()};
async function authInit(){try{googleCfg=await fetch('/auth/config').then(r=>r.json());const me=await fetch('/auth/me').then(r=>r.json());user=me.user||null;renderAuth();if(googleCfg.configured&&window.google)setupGoogle();else if(googleCfg.configured)setTimeout(setupGoogle,700)}catch{googleCfg={required:false,configured:false};renderAuth()}}
function setupGoogle(){if(!window.google||!googleCfg?.client_id)return;google.accounts.id.initialize({client_id:googleCfg.client_id,callback:async r=>{const res=await fetch('/auth/google',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({credential:r.credential})});const d=await res.json();if(!res.ok)return err(d.detail||'Connexion Google impossible');user=d.user;renderAuth()}});google.accounts.id.renderButton($('#googleButton'),{theme:'outline',size:'large',shape:'pill',text:'signin_with'});$('#loginBtn').onclick=()=>google.accounts.id.prompt()}
function renderAuth(){const authed=!!user;$('#authWall').classList.toggle('show',!!(googleCfg?.required&&!authed));$('#loginBtn').style.display=authed?'none':'block';$('#userBox').classList.toggle('show',authed);if(authed){$('#avatar').src=user.picture||'';$('#userName').textContent=user.name||user.email}}
$('#logoutBtn').onclick=async()=>{await fetch('/auth/logout',{method:'POST'});user=null;renderAuth()};
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderPlaylist(){const box=$('#playlistList');box.innerHTML='';(info?.playlist_entries||[]).forEach((it,i)=>{const row=document.createElement('div');row.className='pitem';row.innerHTML=`<input type="checkbox" class="pc" data-i="${i}" checked><img src="${it.thumbnail||''}"><div><b>${escapeHtml(it.title||('Item '+(i+1)))}</b><span>${escapeHtml(it.uploader||'')} ${fmt(it.duration)}</span></div>`;box.appendChild(row)})}
function renderTracks(){const t=$('#tracks'),tl=$('#timeline');t.innerHTML='';tl.innerHTML='';const ch=info?.chapters||[],total=ch.reduce((a,c)=>a+(c.duration||0),0)||1;ch.forEach((c,i)=>{const row=document.createElement('div');row.className='track';row.innerHTML=`<input type="checkbox" class="tc" data-i="${i}" checked><b>${String(i+1).padStart(2,'0')}</b><input type="text" class="tt" data-i="${i}" value="${escapeHtml(c.title||('Track '+(i+1)))}"><em>${fmt(c.duration)}</em>`;t.appendChild(row);const s=document.createElement('button');s.className='seg on';s.style.flex=Math.max(.05,(c.duration||1)/total);s.onclick=()=>{const cb=row.querySelector('.tc');cb.checked=!cb.checked;s.classList.toggle('on',cb.checked)};tl.appendChild(s)})}
function batch(sel,m){document.querySelectorAll(sel).forEach(x=>{if(m==='all')x.checked=true;else if(m==='none')x.checked=false;else x.checked=!x.checked})}
$('#allPlaylist').onclick=()=>batch('.pc','all');$('#nonePlaylist').onclick=()=>batch('.pc','none');$('#invertPlaylist').onclick=()=>batch('.pc','invert');$('#allTracks').onclick=()=>batch('.tc','all');$('#noneTracks').onclick=()=>batch('.tc','none');$('#invertTracks').onclick=()=>batch('.tc','invert');
$('#url').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('#analyse').click()}});
$('#analyse').onclick=async()=>{if(googleCfg?.required&&!user)return err('Connecte-toi avec Google');clearErr();const u=$('#url').value.trim();if(!u)return err('Colle une URL');const fd=new FormData();fd.append('url',u);fd.append('mode',mode);try{const r=await fetch('/api/info',{method:'POST',body:fd});const d=await r.json();if(!r.ok)throw new Error(d.error||d.detail||'Analyse impossible');info=d;$('#title').textContent=d.title||'Publication';$('#sub').textContent=[d.uploader,d.duration?fmt(d.duration):'',d.quality_sizes&&d.quality_sizes[quality]?bytes(d.quality_sizes[quality]):''].filter(Boolean).join(' · ');$('#platform').textContent=(d.platform||'web').toUpperCase();$('#thumb').src=d.thumbnail||'';$('#meta').classList.add('show');renderPlaylist();renderTracks();sync()}catch(e){err(e.message)}};
$('#startJob').onclick=async()=>{if(googleCfg?.required&&!user)return err('Connecte-toi avec Google');clearErr();const u=$('#url').value.trim();if(!u)return err('Colle une URL');const fd=new FormData();fd.append('url',u);fd.append('mode',mode);fd.append('quality',mode==='video'?quality:'best');fd.append('audio_quality',mode==='audio'?quality:'320');const pe=!!(info&&info.is_playlist);fd.append('playlist_mode',pe?'true':'false');fd.append('selected_playlist',JSON.stringify([...document.querySelectorAll('.pc:checked')].map(x=>Number(x.dataset.i))));fd.append('split_tracks',$('#splitTracks').checked?'true':'false');fd.append('selected_tracks',JSON.stringify([...document.querySelectorAll('.tc:checked')].map(x=>Number(x.dataset.i))));const titles={};document.querySelectorAll('.tt').forEach(x=>titles[x.dataset.i]=x.value);fd.append('track_titles',JSON.stringify(titles));const r=await fetch('/api/jobs',{method:'POST',body:fd});const d=await r.json();if(!r.ok)return err(d.error||d.detail||'Job impossible');job=d.job_id;$('#jobBox').classList.add('show');$('#ready').classList.remove('show');$('#bar').style.width='0%';clearInterval(poll);poll=setInterval(checkJob,800);checkJob()};
async function checkJob(){if(!job)return;const r=await fetch('/api/jobs/'+job);const d=await r.json();if(!r.ok){clearInterval(poll);return err(d.detail||'Job introuvable')}const p=Math.max(0,Math.min(100,d.progress||0));$('#bar').style.width=p+'%';$('#jobPct').textContent=p+'%';$('#jobMsg').textContent=(d.message||d.stage||'').toUpperCase();if(d.status==='ready'){clearInterval(poll);$('#ready').href='/api/jobs/'+job+'/download';$('#ready').classList.add('show');saveHistory()}if(d.status==='error'){clearInterval(poll);err(d.error||d.message)}if(d.status==='cancelled'){clearInterval(poll);err('Job annulé')}}
$('#cancelJob').onclick=async()=>{if(job)await fetch('/api/jobs/'+job+'/cancel',{method:'POST'})};
function saveHistory(){const h=JSON.parse(localStorage.getItem('panda_dl_history')||'[]');h.unshift({url:$('#url').value,mode,date:new Date().toLocaleString()});localStorage.setItem('panda_dl_history',JSON.stringify(h.slice(0,6)));renderHistory()}
function renderHistory(){const h=JSON.parse(localStorage.getItem('panda_dl_history')||'[]');$('#history').textContent=h.length?'RÉCENTS · '+h.map(x=>`${x.mode.toUpperCase()} ${x.date}`).join(' · '):''}
renderHistory();sync();authInit();
</script>
</body>
</html>
