</style></head><body>
<div class="page"><div class="top"><div class="brand"><b>PANDA</b>.DOWNLOAD</div><div class="online">V5 ONLINE</div></div><section class="device"><div class="inner">
<div class="display"><div class="grid"></div><div class="wave1"></div><div class="wave2"></div><div class="display-title"><b>PANDA</b> DOWNLOAD<i>.</i></div><div class="result" id="result"><div class="thumb"><img id="thumb"><div class="duration" id="duration"></div></div><div><div class="media-title" id="title"></div><div class="media-sub" id="uploader"></div><div class="platform" id="platform"></div></div></div><div class="urlrow"><div class="urlbox"><input id="url" placeholder="Colle une URL vidéo, audio ou photo..." autocomplete="off"></div><button class="analyse" id="analyse">ANALYSER</button></div></div>

<div class="controls"><div class="module"><div class="module-head"><span class="module-title">MODE</span><span class="power"></span></div><div class="modebuttons"><button type="button" class="modebtn active" id="videoMode">VIDÉO</button><button type="button" class="modebtn" id="audioMode">AUDIO</button><button type="button" class="modebtn" id="photoMode">PHOTO</button></div></div>
<div class="module"><div class="module-head"><span class="module-title">VIDEO</span><span class="power"></span></div><div class="knob"></div><div class="screen"><small>QUALITÉ</small><select id="quality"><option value="best">MEILLEURE</option><option value="2160">2160P · 4K</option><option value="1440">1440P · 2K</option><option value="1080">1080P · FULL HD</option><option value="720">720P · HD</option><option value="480">480P</option><option value="360">360P</option></select></div></div>
<div class="module orange"><div class="module-head"><span class="module-title">AUDIO</span><span class="power"></span></div><div class="knob"></div><div class="screen"><small>QUALITÉ</small><select id="audioQuality"><option value="320">320 KBPS</option><option value="256">256 KBPS</option><option value="192">192 KBPS</option><option value="128">128 KBPS</option></select></div></div>
<div class="module purple"><div class="module-head"><span class="module-title">OUTPUT</span><span class="power"></span></div><div class="output-grid"><div class="field"><small>FORMAT</small><select id="format"><option value="mp4">MP4</option></select></div></div><button class="download" id="download">↓ CRÉER LE JOB VIDÉO</button></div></div>
<div class="playlist-panel" id="playlistPanel"><div class="tracks-head"><strong>PLAYLIST</strong><span class="chapter-meta" id="playlistMeta"></span><div class="track-tools"><button type="button" class="smallbtn" id="playlistAll">TOUT</button><button type="button" class="smallbtn" id="playlistNone">AUCUN</button></div></div><div class="playlistlist" id="playlistList"></div></div>
<div class="tracks-panel" id="tracksPanel"><div class="tracks-head"><label class="track-toggle"><input type="checkbox" id="splitTracks"><span class="switch"></span><span>SÉPARER EN TRACKS</span></label><span class="chapter-meta" id="chapterMeta">Aucun chapitre détecté</span><div class="track-tools"><button type="button" class="smallbtn" id="selectAll">TOUT SÉLECTIONNER</button><button type="button" class="smallbtn" id="selectNone">TOUT DÉSÉLECTIONNER</button></div></div><div class="tracklist" id="tracklist"></div></div>
<div class="jobbox" id="jobBox"><div class="jobtop"><span id="jobMsg">PRÉPARATION</span><span id="jobPct">0%</span></div><div class="progress"><div class="bar" id="bar"></div></div><div class="jobactions"><button class="jobbtn" id="cancelJob">ANNULER</button><a class="jobbtn ready" id="ready">TÉLÉCHARGER ↓</a></div></div><div class="history" id="history"></div>
</div></section></div>
<script>
const $=s=>document.querySelector(s);let mode='video',info=null,job=null,poll=null;const url=$('#url'),analyse=$('#analyse'),result=$('#result'),status=$('#status'),error=$('#error'),quality=$('#quality'),audioQuality=$('#audioQuality'),videoMode=$('#videoMode'),audioMode=$('#audioMode'),photoMode=$('#photoMode'),format=$('#format'),download=$('#download'),tracksPanel=$('#tracksPanel'),splitTracks=$('#splitTracks'),tracklist=$('#tracklist'),chapterMeta=$('#chapterMeta'),playlistPanel=$('#playlistPanel'),playlistList=$('#playlistList'),playlistMeta=$('#playlistMeta');
function fmt(s){if(s==null)return'';s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),x=s%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`:`${m}:${String(x).padStart(2,'0')}`}
function showErr(m){error.textContent=m||'Erreur';error.style.display='block'}function clearErr(){error.style.display='none'}
function setMode(next){mode=next;[videoMode,audioMode,photoMode].forEach((b,i)=>b.classList.toggle('active',['video','audio','image'][i]===mode));quality.disabled=mode!=='video';audioQuality.disabled=mode!=='audio';tracksPanel.classList.toggle('show',mode==='audio'&&!!(info?.chapters?.length));if(mode!=='audio')splitTracks.checked=false;if(mode==='video'){format.innerHTML='<option value="mp4">MP4</option>';download.textContent='↓ CRÉER LE JOB VIDÉO'}else if(mode==='audio'){format.innerHTML='<option value="mp3">MP3</option>';download.textContent='↓ CRÉER LE JOB AUDIO'}else{format.innerHTML='<option value="zip">ORIGINAL / ZIP</option>';download.textContent='↓ CRÉER LE JOB PHOTO'}renderTracks();}
videoMode.onclick=()=>setMode('video');audioMode.onclick=()=>setMode('audio');photoMode.onclick=()=>setMode('image');
function checkedTracks(){return [...document.querySelectorAll('.track-check:checked')].map(x=>Number(x.dataset.i))}function checkedPlaylist(){return [...document.querySelectorAll('.playlist-check:checked')].map(x=>Number(x.dataset.i))}
function renderTracks(){const chapters=info?.chapters||[];tracklist.innerHTML='';if(!chapters.length){chapterMeta.textContent='AUCUN CHAPITRE DÉTECTÉ';return}chapters.forEach((c,i)=>{const row=document.createElement('div');row.className='track';row.innerHTML=`<input class="track-check" data-i="${i}" type="checkbox" checked><b>${String(i+1).padStart(2,'0')}</b><input class="track-title" data-i="${i}" type="text"><em>${fmt(c.start)}</em>`;row.querySelector('.track-title').value=c.title||`Track ${i+1}`;row.querySelector('.track-check').onchange=()=>chapterMeta.textContent=`${chapters.length} CHAPITRES · ${checkedTracks().length} SÉLECTIONNÉS`;tracklist.appendChild(row)});chapterMeta.textContent=`${chapters.length} CHAPITRES · ${chapters.length} SÉLECTIONNÉS`}
$('#selectAll').onclick=()=>{document.querySelectorAll('.track-check').forEach(x=>x.checked=true);renderTrackMeta()};$('#selectNone').onclick=()=>{document.querySelectorAll('.track-check').forEach(x=>x.checked=false);renderTrackMeta()};function renderTrackMeta(){const n=info?.chapters?.length||0;chapterMeta.textContent=n?`${n} CHAPITRES · ${checkedTracks().length} SÉLECTIONNÉS`:'AUCUN CHAPITRE DÉTECTÉ'}
function renderPlaylist(){const entries=info?.playlist_entries||[];playlistList.innerHTML='';playlistPanel.classList.toggle('show',entries.length>0);entries.forEach((it,i)=>{const row=document.createElement('div');row.className='playlistitem';row.innerHTML=`<input class="playlist-check" data-i="${i}" type="checkbox" checked><img src="${it.thumbnail||''}"><div><b></b><small></small></div>`;row.querySelector('b').textContent=it.title||`Élément ${i+1}`;row.querySelector('small').textContent=[it.uploader,fmt(it.duration)].filter(Boolean).join(' · ');playlistList.appendChild(row)});playlistMeta.textContent=entries.length?`${entries.length} ÉLÉMENTS`:''}
$('#playlistAll').onclick=()=>document.querySelectorAll('.playlist-check').forEach(x=>x.checked=true);$('#playlistNone').onclick=()=>document.querySelectorAll('.playlist-check').forEach(x=>x.checked=false);
async function run(){clearErr();result.classList.remove('show');const value=url.value.trim();if(!value)return showErr('Colle une URL valide.');status.style.display='block';analyse.disabled=true;try{const fd=new FormData();fd.append('url',value);fd.append('mode',mode);const r=await fetch('/api/info',{method:'POST',body:fd});const d=await r.json();if(!r.ok)throw new Error(d.error||d.detail||'Analyse impossible.');info=d;$('#thumb').src=d.thumbnail||'';$('#title').textContent=d.title||'Média';$('#uploader').textContent=d.uploader||'';$('#duration').textContent=fmt(d.duration);$('#platform').textContent=(d.platform||'MEDIA').toUpperCase();result.classList.add('show');renderTracks();renderPlaylist();tracksPanel.classList.toggle('show',mode==='audio'&&!!(d.chapters&&d.chapters.length));saveHistory(value,d.title||'Média')}catch(e){showErr(e.message)}finally{status.style.display='none';analyse.disabled=false}}
analyse.onclick=run;url.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();run()}});
download.onclick=async()=>{clearErr();const value=url.value.trim();if(!value)return showErr('Colle une URL valide.');if(mode==='audio'&&splitTracks.checked&&!checkedTracks().length)return showErr('Sélectionne au moins une track.');const fd=new FormData();fd.append('url',value);fd.append('mode',mode);fd.append('quality',mode==='video'?quality.value:'best');fd.append('audio_quality',mode==='audio'?audioQuality.value:'320');fd.append('playlist_mode',info?.is_playlist?'true':'false');fd.append('selected_playlist',JSON.stringify(checkedPlaylist()));fd.append('split_tracks',mode==='audio'&&splitTracks.checked?'true':'false');fd.append('selected_tracks',JSON.stringify(checkedTracks()));const titles={};document.querySelectorAll('.track-title').forEach(x=>titles[x.dataset.i]=x.value);fd.append('track_titles',JSON.stringify(titles));const r=await fetch('/api/jobs',{method:'POST',body:fd});const d=await r.json();if(!r.ok)return showErr(d.error||d.detail||'Job impossible');job=d.job_id;$('#jobBox').classList.add('show');$('#ready').classList.remove('show');clearInterval(poll);poll=setInterval(checkJob,800);checkJob()};
async function checkJob(){if(!job)return;const r=await fetch('/api/jobs/'+job);const d=await r.json();if(!r.ok){clearInterval(poll);return showErr(d.detail||'Job introuvable')}const p=Math.max(0,Math.min(100,d.progress||0));$('#bar').style.width=p+'%';$('#jobPct').textContent=p+'%';$('#jobMsg').textContent=(d.message||d.stage||'').toUpperCase();if(d.status==='ready'){clearInterval(poll);$('#ready').href='/api/jobs/'+job+'/download';$('#ready').classList.add('show')}if(d.status==='error'){clearInterval(poll);showErr(d.error||d.message)}if(d.status==='cancelled'){clearInterval(poll);showErr('Job annulé')}}
$('#cancelJob').onclick=async()=>{if(job)await fetch('/api/jobs/'+job+'/cancel',{method:'POST'})};function saveHistory(u,t){let h=[];try{h=JSON.parse(localStorage.getItem('panda_v5_history')||'[]')}catch{}h=[{u,t,ts:Date.now()},...h.filter(x=>x.u!==u)].slice(0,6);localStorage.setItem('panda_v5_history',JSON.stringify(h));renderHistory()}function renderHistory(){let h=[];try{h=JSON.parse(localStorage.getItem('panda_v5_history')||'[]')}catch{}$('#history').textContent=h.length?'RÉCENTS · '+h.map(x=>x.t).join(' · '):''}renderHistory();setMode('video');
</script></body></html>
