$('#allTracks').onclick=()=>chooseAll(true);$('#noneTracks').onclick=()=>chooseAll(false);$('#invertTracks').onclick=()=>{document.querySelectorAll('.trackcheck').forEach(x=>x.checked=!x.checked);updateTrackCount();refreshSummary()};$('#allPlaylist').onclick=()=>choosePlaylist('all');$('#nonePlaylist').onclick=()=>choosePlaylist('none');$('#invertPlaylist').onclick=()=>choosePlaylist('invert');splitTracks.onchange=refreshSummary;videoMode.onclick=()=>setMode('video');audioMode.onclick=()=>setMode('audio');photoMode.onclick=()=>setMode('image');[quality,audioQuality].forEach(x=>x.onchange=refreshSummary);
function preset(name){if(name==='video1080'){setMode('video');quality.value=[...quality.options].some(o=>o.value==='1080')?'1080':'best'}if(name==='videoBest'){setMode('video');quality.value='best'}if(name==='mp3320'){setMode('audio');splitTracks.checked=false;audioQuality.value='320'}if(name==='audio256'){setMode('audio');splitTracks.checked=false;audioQuality.value='256'}if(name==='tracksMp3'){setMode('audio');splitTracks.checked=true;audioQuality.value='320';chooseAll(true)}if(name==='photo'){setMode('image')}refreshSummary()}document.querySelectorAll('.presetbtn').forEach(b=>b.onclick=()=>preset(b.dataset.preset));
async function analyseUrl(){error.style.display='none';workspace.classList.remove('show');result.classList.remove('show');playlistEditor.classList.remove('show');const value=url.value.trim();if(!value){error.textContent='Colle une URL valide.';error.style.display='block';return}status.style.display='block';analyse.disabled=true;try{const f=new FormData();f.append('url',value);f.append('mode',mode);const r=await fetch('/api/info',{method:'POST',body:f});const d=await r.json();if(!r.ok)throw new Error(d.error||d.detail||'Analyse impossible');info=d;$('#thumb').src=d.thumbnail||'';$('#title').textContent=d.title||'Média';$('#uploader').textContent=d.uploader||'';$('#duration').textContent=fmt(d.duration);$('#platform').textContent=(d.platform||'MEDIA').toUpperCase();chapters=d.chapters||[];qualitySizes=d.quality_sizes||{};fillQualities(d.qualities);renderTracks(chapters);renderPlaylist(d.playlist_entries||[]);$('#chapterStat').textContent=chapters.length?`${chapters.length} chapitres`:(mode==='image'?'Mode photo':'Pas de chapitres');$('#sizeStat').textContent=qualitySizes.best?`~${bytes(qualitySizes.best)}`:(mode==='image'?'Original / ZIP':'Taille inconnue');result.classList.add('show');workspace.classList.add('show');if(mode!=='image'&&!d.qualities?.length&&d.duration)setMode('audio');else setMode(mode);saveHistory(value,d.title||'Média')}catch(e){error.textContent=e.message;error.style.display='block'}finally{status.style.display='none';analyse.disabled=false}}
analyse.onclick=analyseUrl;url.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();analyseUrl()}});
function saveHistory(u,t){let h=[];try{h=JSON.parse(localStorage.getItem('pandaHistory')||'[]')}catch{}h=[{u,t,ts:Date.now()},...h.filter(x=>x.u!==u)].slice(0,6);localStorage.setItem('pandaHistory',JSON.stringify(h));renderHistory()}
function renderHistory(){let h=[];try{h=JSON.parse(localStorage.getItem('pandaHistory')||'[]')}catch{}$('#history').textContent=h.length?`Récents : ${h.map(x=>x.t).join(' · ')}`:''}renderHistory();
async function createJob(){if(activeJob)return;const selected=selectedIndices();if(mode==='audio'&&splitTracks.checked&&!selected.length){error.textContent='Sélectionne au moins une track.';error.style.display='block';return}const selectedPlaylist=[...document.querySelectorAll('.playlistcheck')].map((x,i)=>x.checked?i:null).filter(x=>x!==null);if(info?.is_playlist&&!selectedPlaylist.length){error.textContent='Sélectionne au moins une vidéo de la playlist.';error.style.display='block';return}const titles={};document.querySelectorAll('.tracktitle').forEach((x,i)=>titles[String(i)]=x.value);const f=new FormData();f.append('url',url.value.trim());f.append('mode',mode);f.append('quality',mode==='video'?quality.value:'best');f.append('audio_quality',mode==='audio'?audioQuality.value:'320');f.append('playlist_mode',info?.is_playlist?'true':'false');f.append('selected_playlist',JSON.stringify(selectedPlaylist));f.append('split_tracks',mode==='audio'&&splitTracks.checked?'true':'false');f.append('selected_tracks',JSON.stringify(selected));f.append('track_titles',JSON.stringify(titles));startJob.disabled=true;error.style.display='none';try{const r=await fetch('/api/jobs',{method:'POST',body:f});const d=await r.json();if(!r.ok)throw new Error(d.error||d.detail||'Impossible de créer le job');activeJob=d.job_id;jobbox.classList.add('show');downloadReady.classList.remove('show');cancelJob.style.display='inline-block';pollJob()}catch(e){error.textContent=e.message;error.style.display='block';startJob.disabled=false}}
startJob.onclick=createJob;
async function pollJob(){if(!activeJob)return;try{const r=await fetch(`/api/jobs/${activeJob}`);const d=await r.json();if(!r.ok)throw new Error(d.detail||'Job introuvable');jobstage.textContent=(d.stage||d.status||'JOB').toUpperCase();jobmsg.textContent=d.message||'';jobpct.textContent=`${d.progress||0}%`;progressbar.style.width=`${d.progress||0}%`;if(d.status==='ready'){downloadReady.href=`/api/jobs/${activeJob}/download`;downloadReady.classList.add('show');downloadReady.textContent=`TÉLÉCHARGER ${d.filename||''} ↓`;cancelJob.style.display='none';startJob.disabled=false;return}if(d.status==='error'||d.status==='cancelled'){error.textContent=d.error||d.message||'Job arrêté';error.style.display='block';startJob.disabled=false;activeJob=null;return}pollTimer=setTimeout(pollJob,900)}catch(e){error.textContent=e.message;error.style.display='block';startJob.disabled=false;activeJob=null}}
cancelJob.onclick=async()=>{if(!activeJob)return;await fetch(`/api/jobs/${activeJob}/cancel`,{method:'POST'});};
setMode('video');renderTracks([]);refreshSummary();
</script></body></html>
